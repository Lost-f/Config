# ==================== 核心配置 ====================
# 基础配置
mode: rule
port: 7890
socks-port: 7891
redir-port: 7892
mixed-port: 7893
tproxy-port: 7895
ipv6: true
allow-lan: true
unified-delay: true
tcp-concurrent: true
log-level: warning
bind-address: '*'
find-process-mode: 'always'
global-client-fingerprint: chrome
keep-alive-interval: 15
keep-alive-idle: 600

# 认证配置
authentication:
  - mihomo:yyds999
skip-auth-prefixes:
  - 192.168.1.0/24
  - 192.168.31.0/24
  - 192.168.100.0/24
  - 127.0.0.1/8

# 实验性功能
experimental:
  quic-go-disable-gso: true  
     
# 管理面板配置
external-ui-url: https://github.com/Zephyruso/zashboard/releases/latest/download/dist.zip
external-ui-name: zashboard
external-ui: ui
external-controller: 127.0.0.1:9090
secret: yyds999

# 配置存储
profile:
  store-selected: true
  store-fake-ip: true

# 流量嗅探
sniffer:
  enable: true
  sniff:
    HTTP:
      ports: [80, 8080-8880]
      override-destination: true
    TLS:
      ports: [443, 8443]
    QUIC:
      ports: [443, 8443]
  skip-domain:
    - "Mijia Cloud"
    - "+.push.apple.com"

# TUN模式配置
tun:
  enable: false
  stack: mixed
  dns-hijack:
    - "any:53"
    - "tcp://any:53"
  auto-route: true
  auto-redirect: true
  auto-detect-interface: true
    
# DNS配置
dns:
  enable: true
  ipv6: true
  enhanced-mode: fake-ip
  fake-ip-range: 198.18.0.1/16
  default-nameserver:
    - 223.5.5.5
    - 119.29.29.29
    - 180.184.1.1
  nameserver:
    - https://dns.alidns.com/dns-query
    - https://doh.pub/dns-query
  fake-ip-filter:
    - "*"
    - +.lan
    - +.local
    - time.*.com
    - ntp.*.com
    - +.market.xiaomi.com
    - +.miwifi.com
    - +.docker.io
    - +.push.apple.com

# ==================== 代理策略组 ====================
# 代理策略组配置（proxy-groups）
proxy-groups:
  - name: Proxy                  # 主策略组，用户手动选择节点时首选
    type: select                 # 选择类型，用户可手动选择其中一个节点或策略组
    proxies:
      - Auto                     # 调用Auto策略组（智能测速选最快）
      - HK                       # 香港节点集合（url-test策略组）
      - TW                       # 台湾节点集合（url-test策略组）
      - SG                       # 新加坡节点集合（url-test策略组）
      - JP                       # 日本节点集合（url-test策略组）
      - US                       # 美国节点集合（url-test策略组）
      - KR                       # 韩国节点集合（url-test策略组）
      - EU                       # 欧洲节点集合（url-test策略组）
      - Select                   # 另一个手动选择策略组
      - DIRECT                   # 直连，不走代理
    icon: https://raw.githubusercontent.com/Koolson/Qure/master/IconSet/Apple_News.png

  - name: Select                 # Select策略组，包含所有节点及策略，方便手动精细调节
    include-all: true            # 包含所有代理节点
    type: select                 # 手动选择节点
    icon: https://raw.githubusercontent.com/Koolson/Qure/master/IconSet/Airport.png

  - name: Auto                  # 智能测速Auto最快节点，节省用户手动选择时间
    type: url-test              # 通过访问指定URL测速延迟来判断节点快慢
    include-all: true           # 测试所有代理节点
    interval: 600               # 测速间隔，单位秒，86400秒=24小时
    tolerance: 50               # 延迟容忍度，单位毫秒，50ms以内视为可接受
    icon: https://raw.githubusercontent.com/Koolson/Qure/master/IconSet/Auto.png
    
  # Final，未被规则捕获的流量走这里，保证不丢包
  - name: Final
    type: select
    proxies:
      - Proxy
      - Auto
      - HK
      - TW
      - SG
      - JP
      - US
      - KR
      - EU
      - Select
      - DIRECT
    icon: https://raw.githubusercontent.com/Koolson/Qure/master/IconSet/Final.png

  # 以下是基于节点名称匹配自动测试延迟，筛选出各区域“智选”节点
  - name: HK
    include-all: true
    filter: (?i)港|HK|hk|Hong Kong|HongKong|hongkong   # 节点名匹配规则（正则表达式，不区分大小写）
    type: url-test                                     # 通过访问特定URL测速延迟
    interval: 300                                      # 每5分钟测速一次
    tolerance: 50                                      # 延迟容忍度50ms
    icon: https://raw.githubusercontent.com/Koolson/Qure/master/IconSet/Hong_Kong.png

  - name: TW
    include-all: true
    filter: (?i)台|新北|彰化|TW|Taiwan
    type: url-test
    interval: 300
    tolerance: 50
    icon: https://raw.githubusercontent.com/Koolson/Qure/master/IconSet/Taiwan.png

  - name: SG
    include-all: true
    filter: (?i)新加坡|坡|狮城|SG|Singapore
    type: url-test
    interval: 300
    tolerance: 50
    icon: https://raw.githubusercontent.com/Koolson/Qure/master/IconSet/Singapore.png

  - name: JP
    include-all: true
    filter: (?i)日本|川日|东京|大阪|泉日|埼玉|沪日|深日|JP|Japan
    type: url-test
    interval: 300
    tolerance: 50
    icon: https://raw.githubusercontent.com/Koolson/Qure/master/IconSet/Japan.png

  - name: US
    include-all: true
    filter: (?i)美|波特兰|达拉斯|俄勒冈|凤凰城|费利蒙|硅谷|拉斯维加斯|洛杉矶|圣何塞|圣克拉拉|西雅图|芝加哥|US|United States
    type: url-test
    interval: 300
    tolerance: 50
    icon: https://raw.githubusercontent.com/Koolson/Qure/master/IconSet/United_States.png

  - name: KR
    include-all: true
    filter: (?i)KR|Korea|KOR|首尔|韩|韓
    type: url-test
    interval: 300
    tolerance: 50
    icon: https://raw.githubusercontent.com/Koolson/Qure/master/IconSet/Korea.png
  
  - name: EU
    include-all: true
    filter: "(?i)(?:🇷🇺|🇬🇧|🇩🇪|🇵🇱|🇺🇦|🇫🇷|🇳🇱|🇮🇹|🇷🇴|🇪🇸|🇨🇭|🇹🇷|🇸🇪|🇧🇬|🇦🇹|🇨🇿|🇩🇰|🇳🇴|🇧🇪|🇫🇮|🇪🇺|🇱🇻|🇭🇺|🇮🇪|🇸🇮|🇬🇷|🇸🇰|🇱🇹|🇪🇪|🇲🇩|🇷🇸|🇭🇷|🇨🇾|🇵🇹|🇬🇪|🇧🇾|🇱🇺|🇦🇲|🇦🇱|🇮🇸|🇦🇿|🇲🇰|🇲🇹|🇧🇦|🇬🇮|🇲🇪|🇱🇮|🇮🇲|🇸🇲|🇯🇪|(?:^|[\\s_-])(RU|GB|UK|DE|PL|UA|FR|NL|IT|RO|ES|CH|TR|SE|BG|AT|CZ|DK|NO|BE|FI|EU|LV|HU|IE|SI|GR|SK|LT|EE|MD|RS|HR|CY|PT|GE|BY|LU|AM|AL|IS|AZ|MK|MT|BA|GI|ME|LI|IM|SM|JE)(?:(?=$|[\\s_-])|(?:[-_0-9]+(?=$|[\\s_-])))|(?:^|[\\s_-])[-_0-9]*(RU|GB|UK|DE|PL|UA|FR|NL|IT|RO|ES|CH|TR|SE|BG|AT|CZ|DK|NO|BE|FI|EU|LV|HU|IE|SI|GR|SK|LT|EE|MD|RS|HR|CY|PT|GE|BY|LU|AM|AL|IS|AZ|MK|MT|BA|GI|ME|LI|IM|SM|JE)(?=$|[\\s_-])|俄罗斯|Russia|英国|United Kingdom|德国|Germany|波兰|Poland|乌克兰|Ukraine|法国|France|荷兰|Netherlands|意大利|Italy|罗马尼亚|Romania|西班牙|Spain|瑞士|Switzerland|土耳其|Turkey|瑞典|Sweden|保加利亚|Bulgaria|奥地利|Austria|捷克|Czech|丹麦|Denmark|挪威|Norway|比利时|Belgium|芬兰|Finland|欧盟|Europe|拉脱维亚|Latvia|匈牙利|Hungary|爱尔兰|Ireland|斯洛文尼亚|Slovenia|希腊|Greece|斯洛伐克|Slovakia|立陶宛|Lithuania|爱沙尼亚|Estonia|摩尔多瓦|Moldova|塞尔维亚|Serbia|克罗地亚|Croatia|塞浦路斯|Cyprus|葡萄牙|Portugal|格鲁吉亚|Georgia|白俄罗斯|Belarus|卢森堡|Luxembourg|亚美尼亚|Armenia|阿尔巴尼亚|Albania|冰岛|Iceland|阿塞拜疆|Azerbaijan|北马其顿|Macedonia|马耳他|Malta|波斯尼亚|Bosnia|黑塞哥维那|Herzegovina|直布罗陀|Gibraltar|黑山|Montenegro|列支敦士登|Liechtenstein|曼岛|Isle of Man|圣马力诺|San Marino|泽西岛|Jersey)"
    type: url-test
    interval: 300
    tolerance: 50
    icon: https://raw.githubusercontent.com/Koolson/Qure/master/IconSet/EU.png

  # 以下是针对特定应用或用途的策略组，方便规则调用及分流
  - name: AI
    type: select
    proxies:
      - Proxy
      - Auto
      - HK
      - TW
      - SG
      - JP
